<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安装 M生活踪迹</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
.card { background:#1e293b; border-radius:20px; padding:30px; max-width:420px; width:100%; text-align:center; margin-top:40px; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
.icon { width:90px; height:90px; border-radius:22px; margin-bottom:20px; box-shadow:0 8px 24px rgba(0,0,0,0.3); }
h1 { font-size:24px; margin-bottom:8px; }
.sub { color:#94a3b8; font-size:14px; margin-bottom:30px; }
.steps { text-align:left; background:#0f172a; border-radius:14px; padding:20px; margin:20px 0; }
.step { display:flex; align-items:flex-start; margin-bottom:16px; }
.step:last-child { margin-bottom:0; }
.step-num { background:#3b82f6; color:white; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; flex-shrink:0; margin-right:12px; margin-top:2px; }
.step-text { font-size:14px; line-height:1.5; }
.btn { display:inline-block; background:#3b82f6; color:white; text-decoration:none; padding:14px 40px; border-radius:12px; font-size:17px; font-weight:600; margin:20px 0 10px; transition:background 0.2s; }
.btn:hover { background:#2563eb; }
.note { font-size:12px; color:#64748b; margin-top:20px; line-height:1.6; }
.warn { background:#fef3c7; color:#92400e; border-radius:10px; padding:12px; font-size:13px; margin-top:16px; text-align:left; }
</style>
</head>
<body>
<div class="card">
    <img class="icon" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9zQYyAADc6klEQVR4nJz9d7Ql2XXeCf6Oibj2+ZfeV2VWZXmDKqBgC94QBB1E" alt="icon" onerror="this.style.display='none'">
    <h1>📱 M生活踪迹</h1>
    <p class="sub">一键添加到 iPhone 主屏幕</p>
    
    <div class="steps">
        <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">点击下方按钮，下载安装配置文件</div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">前往 <b>设置</b> → 顶部会出现 <b>"已下载描述文件"</b></div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">点击 <b>"安装"</b>，输入手机密码确认</div>
        </div>
        <div class="step">
            <div class="step-num">4</div>
            <div class="step-text">返回桌面，即可看到 <b>M生活踪迹</b> 图标 🎉</div>
        </div>
    </div>
    
    <a class="btn" href="/install.mobileconfig" download>⬇️ 点击安装到 iPhone</a>
    
    <div class="warn">
        ⚠️ 下载后请用 <b>Safari 浏览器</b> 打开此页面，其他浏览器可能无法触发安装流程。
    </div>
    
    <p class="note">
        此配置文件可随时在 <b>设置 → 通用 → VPN与设备管理</b> 中移除<br>
        仅添加桌面图标，不收集任何数据
    </p>
</div>
</body>
</html>
