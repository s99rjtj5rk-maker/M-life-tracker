<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M生活踪迹">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>安装 M生活踪迹</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%); color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
.card { background:#1e293b; border-radius:20px; padding:30px; max-width:420px; width:100%; text-align:center; margin-top:30px; box-shadow:0 20px 60px rgba(0,0,0,0.4); border:1px solid #334155; }
.icon { width:80px; height:80px; border-radius:20px; margin-bottom:16px; box-shadow:0 8px 24px rgba(0,0,0,0.3); }
h1 { font-size:24px; margin-bottom:6px; }
.sub { color:#94a3b8; font-size:14px; margin-bottom:24px; }
.steps { text-align:left; background:#0f172a; border-radius:14px; padding:20px; margin:20px 0; }
.step { display:flex; align-items:flex-start; margin-bottom:16px; }
.step:last-child { margin-bottom:0; }
.step-num { background:#3b82f6; color:white; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; flex-shrink:0; margin-right:12px; margin-top:2px; }
.step-text { font-size:14px; line-height:1.5; }
.btn { display:inline-block; background:linear-gradient(135deg,#3b82f6,#6366f1); color:white; text-decoration:none; padding:15px 48px; border-radius:14px; font-size:17px; font-weight:600; margin:16px 0 8px; box-shadow:0 4px 16px rgba(59,130,246,0.4); }
.btn:active { transform:scale(0.97); }
.note { font-size:12px; color:#64748b; margin-top:16px; line-height:1.6; }
.warn { background:#422006; color:#fbbf24; border-radius:10px; padding:12px 14px; font-size:13px; margin-top:16px; text-align:left; border:1px solid #78350f; }
.badge { display:inline-block; background:#065f46; color:#6ee7b7; border-radius:6px; padding:3px 10px; font-size:11px; margin-bottom:16px; }
.footer { margin-top:24px; font-size:12px; color:#475569; }
</style>
</head>
<body>
<div class="card">
    <img class="icon" src="/apple-touch-icon.png" alt="M生活踪迹">
    <h1>M生活踪迹</h1>
    <p class="sub">📱 一键添加到 iPhone 主屏幕</p>
    <div class="badge">🟢 永久在线 · Railway 托管</div>
    
    <div class="steps">
        <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">点击下方 <b>「安装到 iPhone」</b> 按钮</div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">系统弹出提示 → 点击 <b>「允许」</b> 下载描述文件</div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">前往 <b>设置</b> → 顶部 <b>「已下载描述文件」</b></div>
        </div>
        <div class="step">
            <div class="step-num">4</div>
            <div class="step-text">点击 <b>「安装」</b> → 输入密码 → 完成！🎉</div>
        </div>
    </div>
    
    <a class="btn" href="/install.mobileconfig">📲 安装到 iPhone</a>
    
    <div class="warn">
        ⚠️ <b>必须用 Safari 浏览器</b> 打开此页面<br>
        Chrome/微信等浏览器无法触发安装流程
    </div>
    
    <p class="note">
        安装后在桌面看到 🦫 卡皮巴拉图标<br>
        配置文件可随时在 <b>设置 → 通用 → VPN与设备管理</b> 中删除
    </p>
</div>
<p class="footer">永久域名：m-life-tracker-production.up.railway.app</p>
</body>
</html>
